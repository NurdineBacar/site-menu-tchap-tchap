services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: menu-tchap-tchap:latest
    container_name: menu-tchap-tchap
    ports:
      - "3008:3008"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3008"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3008').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
